<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>BMW M4 CS — Performance Automotive Experience</title>
    <meta
      name="description"
      content="A scroll-driven single-car experience for the BMW M4 CS: a cinematic hero, an editorial photo sequence, and motion-led interactions. Design study; not affiliated with BMW."
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#100904" />

    <!--
      Open Graph / X. og:image is intentionally a relative path: the
      production URL is not yet known, so no absolute URL is invented here.
      Swap both image entries for absolute URLs once the site is deployed.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Zero Mercy" />
    <meta property="og:title" content="BMW M4 CS — Performance Automotive Experience" />
    <meta
      property="og:description"
      content="A scroll-driven single-car experience for the BMW M4 CS: a cinematic hero, an editorial photo sequence, and motion-led interactions."
    />
    <meta property="og:image" content="./images/m4-cs-1.jpg" />
    <meta
      property="og:image:alt"
      content="BMW M4 CS seen head-on on a coastal road at golden hour"
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BMW M4 CS — Performance Automotive Experience" />
    <meta
      name="twitter:description"
      content="A scroll-driven single-car experience for the BMW M4 CS: a cinematic hero, an editorial photo sequence, and motion-led interactions."
    />
    <meta name="twitter:image" content="./images/m4-cs-1.jpg" />

    <!-- canonical is deliberately omitted until the production URL exists. -->

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
